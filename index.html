function favorites(){const ys=yachts.filter(y=>state.favorites.has(y.id));return `<div class="screen"><div class="screen-pad"><button class="back" onclick="goHome()">‹</button><h1 style="font-size:38px;margin:25px 0">Favorites</h1>${ys.length?ys.map(boatCard).join(''):'<div class="empty" style="padding-top:100px"><h2>No favorites yet</h2><p>Tap the heart on a yacht to save it here.</p></div>'}</div></div>`}
function searchScreen(){const q=state.query.trim().toLowerCase();const results=yachts.filter(y=>!q||[y.name,y.builder,y.location].join(' ').toLowerCase().includes(q));return `<div class="screen"><div class="search"><button class="back" onclick="goHome()">‹</button><h1 style="font-size:38px;margin:25px 0">Search</h1><div class="searchbox">⌕<input autofocus value="${state.query}" oninput="state.query=this.value;render();setTimeout(()=>{const i=document.querySelector('.searchbox input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},0)" placeholder="Search yachts, locations or builders"></div>${!q?`<h2 style="margin:35px 0 12px">Suggestions</h2><div class="suggestions">${['Payment not relevant','Yachts','Locations','Builders'].slice(1).map(s=>`<button onclick="state.query='${s.slice(0,-1)}';render()">⌕ ${s}</button>`).join('')}</div><h2 style="margin:35px 0 12px">Popular locations</h2><div class="locations-grid">${locations.flatMap(x=>x[1]).slice(0,12).map(l=>`<button class="loc-btn" onclick="openLocation('${l.replace(/'/g,"\\'")}')">${l}</button>`).join('')}</div>`:`<h2 style="margin:35px 0 12px">Results</h2>${results.map(y=>`<button class="mini-result" onclick="openYacht('${y.id}')"><img src="${y.image||fallbackYachtImage(y)}"><div style="text-align:left"><b>${y.name}</b><span>${y.location} · ${money(y.price,y.currency)} ${y.duration}</span></div></button>`).join('')||'<p>No matching yachts.</p>'}`}</div></div>`}
function render(){const app=document.getElementById('app');let html=state.screen==='home'?home():state.screen==='locations'?locationsScreen():state.screen==='listing'?listing():state.screen==='detail'?detail():state.screen==='booking'?booking():state.screen==='payment'?payment():state.screen==='success'?success():state.screen==='charters'?charters():state.screen==='charterDetail'?charterDetail():state.screen==='favorites'?favorites():state.screen==='search'?searchScreen():home();app.innerHTML=html;if(state.screen!=='payment'&&state.screen!=='booking'&&state.screen!=='success'&&state.screen!=='charterDetail'){app.insertAdjacentHTML('beforeend','<button aria-label="Search" onclick="openSearch()" style="position:fixed;right:22px;bottom:24px;z-index:55;width:62px;height:62px;border-radius:50%;background:#111;color:#fff;font-size:34px;box-shadow:0 8px 25px rgba(0,0,0,.22)">⌕</button>');}if(state.account)app.insertAdjacentHTML('beforeend',accountPanel())}
function goHome(){state.screen='home';state.location=null;render()}
function openSearch(){state.screen='search';render()}
render();
</script>
</body>
</html>
